<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Español</title>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; background: #f4f6f8; color: #0f172a; }
    pre, code { background: #ffffff; }
    pre { padding: 12px; overflow: auto; border: 1px solid #e5e7eb; border-radius: 8px; }
    nav { margin-bottom: 1rem; }
    a { color: #0ea5e9; }
    a:hover { color: #0284c7; }
    input[type="text"] { width: 70%; padding: 6px 8px; }
    button { padding: 6px 10px; }
    .path { color: #475569; font-size: 0.9em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <nav>
    <a id="homeLink" href="index.html?file=index.md" style="display:none">Página principal</a>
  </nav>
  <main id="content">Loading…</main>
  <script>
    const params = new URLSearchParams(location.search);
    const homeLink = document.getElementById('homeLink');
    const content = document.getElementById('content');

    let currentMdPath = 'index.md';

    function resolveRelative(href, baseMdPath) {
      try {
        const baseUrl = new URL(baseMdPath, location.origin + '/');
        // Ensure baseUrl ends with a file, resolve relative to its directory
        const dirUrl = new URL('.', baseUrl);
        const abs = new URL(href, dirUrl);
        // Return path relative to site root
        return abs.pathname.replace(/^\//, '');
      } catch (e) {
        return href;
      }
    }

    function load(mdPath) {
      if (!mdPath) return;
      // Toggle home link visibility when not on home
      if (mdPath !== 'index.md') {
        homeLink.style.display = '';
      } else {
        homeLink.style.display = 'none';
      }
      currentMdPath = mdPath;
      fetch(mdPath).then(r => {
        if (!r.ok) throw new Error('Not found: ' + mdPath);
        return r.text();
      }).then(txt => {
        const html = DOMPurify.sanitize(marked.parse(txt));
        content.innerHTML = html;
        // Intercept clicks on markdown links to .md files
        content.querySelectorAll('a[href$=".md"]').forEach(a => {
          a.addEventListener('click', ev => {
            const href = a.getAttribute('href');
            if (!href) return;
            // Only intercept relative .md links
            if (/^https?:\/\//i.test(href)) return;
            ev.preventDefault();
            const resolved = resolveRelative(href, currentMdPath);
            const url = new URL(location.href);
            url.searchParams.set('file', resolved);
            history.pushState({ file: resolved }, '', url);
            load(resolved);
          });
        });
      }).catch(err => {
        content.textContent = err.message;
      });
    }

    // Default from ?file=... or index.md
    const initial = params.get('file') || 'index.md';
    load(initial);

    // Handle browser back/forward
    window.addEventListener('popstate', () => {
      const sp = new URLSearchParams(location.search);
      const file = sp.get('file') || 'index.md';
      if (file !== currentMdPath) {
        load(file);
      }
    });
  </script>
</body>
</html>
