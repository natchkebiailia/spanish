<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown Viewer</title>
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
    pre, code { background: #f6f8fa; }
    pre { padding: 12px; overflow: auto; }
    nav { margin-bottom: 1rem; }
    input[type="text"] { width: 70%; padding: 6px 8px; }
    button { padding: 6px 10px; }
    .path { color: #666; font-size: 0.9em; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <nav>
    <a id="homeLink" href="index.html?file=index.md" style="display:none">Go to home</a>
  </nav>
  <main id="content">Loading…</main>
  <script>
    const params = new URLSearchParams(location.search);
    const homeLink = document.getElementById('homeLink');
    const content = document.getElementById('content');

    function load(mdPath) {
      if (!mdPath) return;
      // Toggle home link visibility when not on home
      if (mdPath !== 'index.md') {
        homeLink.style.display = '';
      } else {
        homeLink.style.display = 'none';
      }
      fetch(mdPath).then(r => {
        if (!r.ok) throw new Error('Not found: ' + mdPath);
        return r.text();
      }).then(txt => {
        const html = DOMPurify.sanitize(marked.parse(txt));
        content.innerHTML = html;
        // Intercept clicks on markdown links to .md files
        content.querySelectorAll('a[href$=".md"]').forEach(a => {
          a.addEventListener('click', ev => {
            const href = a.getAttribute('href');
            if (!href) return;
            // Only intercept relative .md links
            if (/^https?:\/\//i.test(href)) return;
            ev.preventDefault();
            const url = new URL(location.href);
            url.searchParams.set('file', href);
            history.replaceState({}, '', url);
            load(href);
          });
        });
      }).catch(err => {
        content.textContent = err.message;
      });
    }

    // Default from ?file=... or index.md
    const initial = params.get('file') || 'index.md';
    load(initial);
  </script>
</body>
</html>
